<!DOCTYPE html>
<html lang="en">
<head>
	<title>Notes</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="icon" href="img/favicon.ico">
	<link rel="stylesheet" type="text/css" href="css/main.css">
	<style>
		@media print {
			body {
				color: #000;
				background-color: #fff;
			}
		}
	</style>
	<script>
		function copyProperty(query, property) {
			const val = document.querySelector(query)[property];
			navigator.clipboard.writeText(val);
		}
	</script>
</head>
<body>
	<div>
		<div style="display: grid; grid-template-columns: 1fr 10fr; max-width: 64em;">
			<label for="encryption_key">encryption_key:</label>
			<input id="encryption_key" type="text" onchange="setEncryptionKey();">
			<label for="is_leader">is_leader:</label>
			<input id="is_leader" type="checkbox" onchange="setIsLeader();">
			<label for="web_rtc_leader_sdp" onclick="copyProperty('#web_rtc_leader_sdp', 'value');">web_rtc_leader_sdp:</label>
			<input id="web_rtc_leader_sdp" type="text" onchange="setWebRTCFollowerSDP();">
			<label for="web_rtc_follower_sdp" onclick="copyProperty('#web_rtc_follower_sdp', 'value');">web_rtc_follower_sdp:</label>
			<input id="web_rtc_follower_sdp" type="text" onchange="setRemoteDescription();">
			<label for="note">note:</label>
			<input id="note" type="textarea" onchange="setNote();">
		</div>
	</div>
</body>
<script>
function init() {
	const encryptionKey = localStorage.getItem('encryption_key') || '';
	const isLeader = (localStorage.getItem('is_leader') == 'true');
	document.querySelector('#encryption_key').value = encryptionKey;
	document.querySelector('#is_leader').checked = isLeader;
	if (isLeader) {
		document.querySelector('#web_rtc_leader_sdp').disabled = true;
		document.querySelector('#web_rtc_follower_sdp').disabled = false;
	} else {
		document.querySelector('#web_rtc_leader_sdp').disabled = false;
		document.querySelector('#web_rtc_follower_sdp').disabled = true;
	}
	if (isLeader) {
		setTimeout(setWebRTCLeaderSDP, 100);
	}
}
init();
function setIsLeader() {
	const isLeader = document.querySelector('#is_leader').checked;
	localStorage.setItem('is_leader', isLeader);
	if (isLeader) {
		document.querySelector('#web_rtc_leader_sdp').disabled = true;
		document.querySelector('#web_rtc_follower_sdp').disabled = false;
	} else {
		document.querySelector('#web_rtc_leader_sdp').disabled = false;
		document.querySelector('#web_rtc_follower_sdp').disabled = true;
	}
}
function setEncryptionKey() {
	localStorage.setItem('encryption_key', document.querySelector('#encryption_key').value);
}
var rtc = new RTCPeerConnection();
function setRemoteDescription() {
	try {
		const rd = JSON.parse(document.querySelector('#web_rtc_follower_sdp').value);
		rtc.setRemoteDescription(rd);
	} catch (ex) {
		console.log(ex);
	}
}
function setWebRTCLeaderSDP() {
	const dc = rtc.createDataChannel('channel');
	rtc.dc = dc;
	dc.onmessage = (evt) => console.log('Message: ' + evt.data);
	dc.onopen = (evt) => console.log('Connection opened!');
	rtc.onicecandidate = (evt) => {
		const sdp = JSON.stringify(rtc.localDescription);
		document.querySelector('#web_rtc_leader_sdp').value = sdp;
		localStorage.setItem('web_rtc_leader_sdp', sdp);
	}
	rtc.createOffer().then((offer) => rtc.setLocalDescription(offer)).then((evt) => console.log('success'));
}
function setWebRTCFollowerSDP() {
	const leaderSDP = document.querySelector('#web_rtc_leader_sdp').value;
	try {
		const offer = JSON.parse(leaderSDP);
		rtc.onicecandidate = (evt) => {
			const sdp = JSON.stringify(rtc.localDescription);
			document.querySelector('#web_rtc_follower_sdp').value = sdp;
			localStorage.setItem('web_rtc_follower_sdp', sdp);
		}
		rtc.ondatachannel = (evt) => {
			rtc.dc = evt.channel;
			rtc.dc.onmessage = (evt) => console.log('New message: ' + evt.data);
			rtc.dc.onopen = (evt) => console.log('Connection opened.');
		}
		rtc.setRemoteDescription(offer).then((evt) => console.log('offer set'));
		rtc.createAnswer().then(x => rtc.setLocalDescription(x)).then((x) => console.log('answered'));
	} catch (ex) {
		console.log(ex);
		document.querySelector('#web_rtc_follower_sdp').value = '';
		localStorage.setItem('web_rtc_follower_sdp', '');
	}
}
function setNote() {
	const anote = document.querySelector('#note').value;
	rtc.dc.send(anote);
}
</script>
</html>
