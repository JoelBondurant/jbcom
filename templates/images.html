<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Images</title>
    <style>
        :root {
            --bg-color: #020617;
            --text-color: #f1f5f9;
            --secondary-text-color: #94a3b8;
        }

        body {
            font-family: sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 2rem;
            margin: 0;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        .container {
            max-width: 90vw;
            max-height: 90vh;
            width: fit-content;
            height: fit-content;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
        }

        .heading {
            font-size: 2.25rem;
            font-weight: bold;
            color: #fff;
            margin-bottom: 0.5rem;
        }

        .sub-heading {
            color: var(--secondary-text-color);
            margin-bottom: 2rem;
        }

        #viewer-container {
            position: relative;
            cursor: pointer;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            border-radius: 0.5rem;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            max-width: 100%;
            max-height: 100%;
        }

        #current-image {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            display: block;
            object-fit: contain;
        }

        .nav-text {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.7);
            font-size: 1.5rem;
            font-weight: bold;
            pointer-events: none;
            user-select: none;
            opacity: 0;
            transition: opacity 0.2s;
        }

        #viewer-container:hover .nav-text {
            opacity: 1;
        }

        .left-nav {
            left: 2rem;
        }

        .right-nav {
            right: 2rem;
        }

        .image-counter {
            margin-top: 1rem;
            color: var(--secondary-text-color);
        }
    </style>
</head>
<body>

    <div class="container">

        <div id="image-urls" style="display: none;">
            <ul>
                {% for img in images %}
                <li>/img/{{ img }}</li>
                {% endfor %}
            </ul>
        </div>

        <div id="viewer-container">
            <img id="current-image" src="" alt="Current Image">
            <span class="nav-text left-nav">&lt;</span>
            <span class="nav-text right-nav">&gt;</span>
        </div>

        <p id="image-counter" class="image-counter"></p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const currentImage = document.getElementById('current-image');
            const imageCounter = document.getElementById('image-counter');
            const viewerContainer = document.getElementById('viewer-container');

            // Get all image URLs from the hidden list
            const imageUrls = Array.from(document.querySelectorAll('#image-urls li')).map(li => li.textContent.trim());
            let currentIndex = 0;

            const updateImage = () => {
                if (imageUrls.length === 0) {
                    currentImage.src = '';
                    imageCounter.textContent = 'No images to display.';
                    return;
                }
                currentImage.src = imageUrls[currentIndex];
                imageCounter.textContent = `${currentIndex + 1} of ${imageUrls.length}`;
            };

            // Main click handler
            viewerContainer.addEventListener('click', (event) => {
                const rect = event.target.getBoundingClientRect();
                const x = event.clientX - rect.left;
                const width = rect.width;

                if (x > width / 2) {
                    // Right half: next image
                    currentIndex = (currentIndex + 1) % imageUrls.length;
                } else {
                    // Left half: previous image
                    currentIndex = (currentIndex - 1 + imageUrls.length) % imageUrls.length;
                }
                updateImage();
            });

            // Key press handler for arrow keys
            document.addEventListener('keydown', (event) => {
                if (imageUrls.length === 0) {
                    return;
                }

                if (event.key === 'ArrowRight') {
                    currentIndex = (currentIndex + 1) % imageUrls.length;
                    updateImage();
                } else if (event.key === 'ArrowLeft') {
                    currentIndex = (currentIndex - 1 + imageUrls.length) % imageUrls.length;
                    updateImage();
                }
            });

            // Initialize the viewer with the first image
            updateImage();
        });
    </script>
</body>
</html>
